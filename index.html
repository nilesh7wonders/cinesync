<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineSync</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top">
  <button class="chip" id="ch-en" onclick="setLang('en')">English</button>
  <button class="chip" id="ch-hi" onclick="setLang('hi')">हिन्दी</button>
  <button class="chip" id="ch-gu" onclick="setLang('gu')">ગુજરાતી</button>
  <button class="chip" onclick="toggleDark()">🌓</button>
</div>

<div class="card c screen on" id="scrLogin">
  <div class="logo">🎬</div>
  <h1>CineSync</h1>
  <p class="tag" id="tag"></p>
  <div class="field"><label id="lblPhone"></label>
    <input type="text" id="phone" placeholder="+91 ..."></div>
  <button class="btn" onclick="sendOtp()" id="btnNext"></button>
</div>

<div class="card c screen" id="scrOtp">
  <button class="back" onclick="show('scrLogin')">←</button>
  <div class="logo">🔐</div>
  <h1>CineSync</h1>
  <p class="tag" id="otpTag"></p>
  <div class="otp" id="otpRow"></div>
  <button class="btn" onclick="verifyOtp()" id="btnVerify"></button>
  <p class="msg c" id="otpMsg"></p>
</div>

<div class="card c screen" id="scrHome">
  <div class="logo">🎬</div>
  <h1>CineSync</h1>
  <p class="tag" id="homeTag"></p>
  <div id="plist" style="text-align:left"></div>
  <button class="btn" onclick="show('scrNew')" id="btnNew"></button>
  <button class="btn ghost" onclick="show('scrContacts')" id="btnContacts"></button>
  <button class="btn ghost" onclick="doLogout()" id="btnOut"></button>
</div>

<div class="card screen" id="scrNew">
  <button class="back" onclick="show('scrHome')">←</button>
  <div class="c"><div class="logo">🎬</div>
    <h1 id="lblNewTitle"></h1><p class="tag" id="lblNewTag"></p></div>
  <div class="field"><label id="lblPName"></label><input type="text" id="pname"></div>
  <div class="field"><label id="lblPType"></label><div class="types" id="types"></div></div>
  <button class="btn" onclick="createProject()" id="btnCreate"></button>
  <p class="msg" id="pMsg"></p>
</div>

<div class="card screen" id="scrContacts">
  <button class="back" onclick="show('scrHome')">←</button>
  <div class="c"><div class="logo">📇</div>
    <h1 id="lblCTitle"></h1><p class="tag" id="lblCTag"></p></div>
  <div class="field"><label id="lblCName"></label><input type="text" id="cname"></div>
  <div class="field"><label id="lblCPhone"></label><input type="text" id="cphone" placeholder="+91 ..."></div>
  <div class="field"><label id="lblCJob"></label><input type="text" id="cjob"></div>
  <button class="btn" onclick="addContact()" id="btnAddC"></button>
  <p class="msg" id="cMsg"></p>
  <div id="clist" style="margin-top:16px"></div>
</div>

<div class="card screen" id="scrProj">
  <button class="back" onclick="show('scrHome')">←</button>
  <div class="c"><div class="logo">🎬</div>
    <h1 id="projName"></h1><p class="tag" id="projType"></p></div>
  <div class="tabs">
    <div class="tab on" id="tabCast" onclick="projTab('cast')"></div>
    <div class="tab" id="tabScript" onclick="projTab('script')"></div>
    <div class="tab" id="tabSched" onclick="projTab('sched')"></div>
    <div class="tab" id="tabBud" onclick="projTab('bud')"></div>
  </div>
  <div id="paneCast">
    <button class="btn" onclick="show('scrPick')" id="btnAddCast"></button>
    <div id="castList" style="margin-top:14px"></div>
  </div>
  <div id="paneScript" style="display:none">
    <p class="hint c" id="hintScript"></p>
  </div>
  <div id="paneSched" style="display:none">
    <p class="hint c" id="hintSched"></p>
  </div>
  <div id="paneBud" style="display:none">
    <p class="hint c" id="hintBud"></p>
  </div>
</div>

<div class="card screen" id="scrPick">
  <button class="back" onclick="show('scrProj')">←</button>
  <div class="c"><div class="logo">📇</div>
    <h1 id="lblPick"></h1><p class="tag" id="lblPickTag"></p></div>
  <div id="pickList"></div>
</div>

<script src="app.js"></script>
</body>
</html>

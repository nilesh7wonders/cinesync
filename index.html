<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineSync</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f4f1ea; color:#222; transition:0.3s; }
  body.dark { background:#141414; color:#eee; }
  .card { width:100%; max-width:380px; padding:32px 24px; text-align:center; }
  .logo { font-size:40px; }
  h1 { font-size:28px; margin:8px 0 4px; letter-spacing:1px; }
  .tag { font-size:14px; opacity:0.7; margin-bottom:28px; }
  .field { text-align:left; margin-bottom:16px; }
  .field label { font-size:14px; display:block; margin-bottom:6px; }
  input { width:100%; padding:14px; font-size:16px; border:1px solid #bbb;
          border-radius:10px; background:#fff; color:#222; }
  body.dark input { background:#222; color:#eee; border-color:#555; }
  .btn { width:100%; padding:14px; font-size:17px; border:none; border-radius:10px;
         background:#c0392b; color:#fff; font-weight:bold; cursor:pointer; margin-top:8px; }
  .btn.ghost { background:transparent; color:inherit; border:1px solid #999; margin-top:12px; }
  .top { position:fixed; top:14px; right:14px; display:flex; gap:8px; }
  .chip { padding:6px 10px; border-radius:20px; border:1px solid #999;
          font-size:13px; cursor:pointer; background:transparent; color:inherit; }
  .chip.on { background:#c0392b; color:#fff; border-color:#c0392b; }
  .screen { display:none; }
  .screen.on { display:block; }
  .back { float:left; font-size:22px; cursor:pointer; background:none;
          border:none; color:inherit; margin-bottom:12px; }
  .otp { display:flex; gap:8px; justify-content:center; margin:18px 0; }
  .otp input { width:44px; height:54px; text-align:center; font-size:22px;
               font-weight:bold; padding:0; }
  .msg { font-size:13px; margin-top:12px; min-height:18px; }
  .msg.err { color:#c0392b; }
  .msg.ok { color:#27ae60; }
</style>
</head>
<body>
  <div class="top">
    <button class="chip" onclick="setLang('en',this)">English</button>
    <button class="chip" onclick="setLang('hi',this)">हिन्दी</button>
    <button class="chip" onclick="setLang('gu',this)">ગુજરાતી</button>
    <button class="chip" onclick="toggleDark()">🌓</button>
  </div>

  <!-- સ્ક્રીન 1: Login -->
  <div class="card screen on" id="scrLogin">
    <div class="logo">🎬</div>
    <h1>CineSync</h1>
    <p class="tag" id="tag"></p>
    <div class="field">
      <label id="lblPhone"></label>
      <input type="text" id="phone" placeholder="+91 ...">
    </div>
    <button class="btn" onclick="sendOtp()" id="btnNext"></button>
    <button class="btn ghost" id="btnGoogle">G — <span id="lblGoogle"></span></button>
  </div>

  <!-- સ્ક્રીન 2: OTP -->
  <div class="card screen" id="scrOtp">
    <button class="back" onclick="show('scrLogin')">←</button>
    <div class="logo">🔐</div>
    <h1>CineSync</h1>
    <p class="tag" id="otpTag"></p>
    <div class="otp">
      <input maxlength="1" inputmode="numeric" oninput="otpMove(this,0)" onkeydown="otpBack(event,this,0)">
      <input maxlength="1" inputmode="numeric" oninput="otpMove(this,1)" onkeydown="otpBack(event,this,1)">
      <input maxlength="1" inputmode="numeric" oninput="otpMove(this,2)" onkeydown="otpBack(event,this,2      <input maxlength="1" inputmode="numeric" oninput="otpMove(this,3)" onkeydown="otpBack(event,this,3)">
      <input maxlength="1" inputmode="numeric" oninput="otpMove(this,4)" onkeydown="otpBack(event,this,4)">
      <input maxlength="1" inputmode="numeric" oninput="otpMove(this,5)" onkeydown="otpBack(event,this,5)">
    </div>
    <button class="btn" onclick="verifyOtp()" id="btnVerify"></button>
    <p class="msg" id="otpMsg"></p>
    <p class="msg" style="opacity:0.6" id="otpNote"></p>
  </div>

<script>
const T = {
  en: { tag:"Film Production, One Chain — Script to Budget",
        phone:"Phone or Email", next:"Continue",
        google:"Sign in with Google",
        otpTag:"Enter the 6-digit code", verify:"Verify & Enter",
        wrong:"Wrong code — try again", ok:"Welcome to CineSync!",
        note:"SMS sending comes later (under construction)" },
  hi: { tag:"फिल्म प्रोडक्शन, एक श्रृंखला — Script से Budget तक",
        phone:"फ़ोन या ईमेल", next:"आगे बढ़ें",
        google:"Google से प्रवेश",
        otpTag:"6 अंक का कोड डालें", verify:"जाँचें और प्रवेश करें",
        wrong:"गलत कोड — फिर कोशिश करें", ok:"CineSync में आपका स्वागत है!",
        note:"SMS भेजना बाद में आएगा (काम चालू है)" },
  gu: { tag:"ફિલ્મ પ્રોડક્શન, એક સાંકળ — Script થી Budget સુધી",
        phone:"ફોન નંબર કે ઈમેલ", next:"આગળ વધો",
        google:"Google થી પ્રવેશ",
        otpTag:"6 આંકડા નો કોડ નાખો", verify:"ચકાસો અને પ્રવેશો",
        wrong:"ખોટો કોડ — ફરી પ્રયત્ન કરો", ok:"CineSync માં સ્વાગત!",
        note:"SMS મોકલવાનું પછી આવશે (કામ ચાલુ છે)" }
};
let lang = localStorage.getItem("cs_lang") || "gu";

function setLang(l, btn){
  lang = l; localStorage.setItem("cs_lang", l);
  const t = T[l];
  document.getElementById("tag").textContent = t.tag;
  document.getElementById("otpTag").textContent = t.otpTag;
  document.getElementById("lblPhone").textContent = t.phone;
  document.getElementById("btnNext").textContent = t.next;
  document.getElementById("btnVerify").textContent = t.verify;
  document.getElementById("lblGoogle").textContent = t.google;
  document.getElementById("otpNote").textContent = t.note;
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  btn.classList.add("on");
}
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("cs_dark", document.body.classList.contains("dark") ? "1" : "0");
}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
}
function sendOtp(){
  const v = document.getElementById("phone").value.trim();
  if(!v){ document.getElementById("phone").focus(); return; }
  show("scrOtp");
  document.querySelectorAll(".otp input")[0].focus();
}
const CODE = "123456";
const boxes = () => document.querySelectorAll(".otp input");
function otpMove(el, i){
  if(el.value && i < 5) boxes()[i+1].focus();
}
function otpBack(e, el, i){
  if(e.key === "Backspace"){
    if(el.value){ el.value = ""; e.preventDefault(); }        // આંકડો હોય તો પહેલા એ ડીલેટ
    else if(i > 0){                                            // ખાલી હોય તો પાછળના ખાનાં માં
      boxes()[i-1].focus(); boxes()[i-1].value = ""; e.preventDefault();
    }
  }
}
function verifyOtp(){
  const code = [...boxes()].map(i=>i.value).join("");
  const msg = document.getElementById("otpMsg");
  if(code === CODE){
    msg.className = "msg ok"; msg.textContent = T[lang].ok;
    setTimeout(()=>{ alert(T[lang].ok); }, 400);
  } else {
    msg.className = "msg err"; msg.textContent = T[lang].wrong;
  }
}
if(localStorage.getItem("cs_dark")==="1") document.body.classList.add("dark");
document.getElementById("phone").addEventListener("keydown", e=>{ if(e.key==="Enter") sendOtp(); });
setLang(lang, document.querySelectorAll(".chip")[2]);
</script>
</body>
</html>

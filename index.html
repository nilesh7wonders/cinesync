<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineSync</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f4f1ea; color:#222; transition:0.3s; }
  body.dark { background:#141414; color:#eee; }
  .card { width:100%; max-width:400px; padding:32px 24px; text-align:center; }
  .logo { font-size:40px; }
  h1 { font-size:26px; margin:8px 0 4px; }
  .tag { font-size:14px; opacity:0.7; margin-bottom:24px; }
  .field { text-align:left; margin-bottom:16px; }
  .field label { font-size:14px; display:block; margin-bottom:6px; }
  input { width:100%; padding:14px; font-size:16px; border:1px solid #bbb;
          border-radius:10px; background:#fff; color:#222; }
  body.dark input { background:#222; color:#eee; border-color:#555; }
  .btn { width:100%; padding:14px; font-size:17px; border:none; border-radius:10px;
         background:#c0392b; color:#fff; font-weight:bold; cursor:pointer; margin-top:8px; }
  .btn.ghost { background:transparent; color:inherit; border:1px solid #999; margin-top:12px; }
  .top { position:fixed; top:14px; right:14px; display:flex; gap:8px; }
  .chip { padding:6px 10px; border-radius:20px; border:1px solid #999;
          font-size:13px; cursor:pointer; background:transparent; color:inherit; }
  .chip.on { background:#c0392b; color:#fff; border-color:#c0392b; }
  .screen { display:none; }
  .screen.on { display:block; }
  .back { float:left; font-size:22px; cursor:pointer; background:none;
          border:none; color:inherit; margin-bottom:12px; }
  .otp { display:flex; gap:8px; justify-content:center; margin:18px 0; }
  .otp input { width:44px; height:54px; text-align:center; font-size:22px;
               font-weight:bold; padding:0; }
  .msg { font-size:13px; margin-top:12px; min-height:18px; }
  .msg.err { color:#c0392b; }
  .msg.ok { color:#27ae60; }
  .types { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  .type { padding:16px 8px; border:2px solid #bbb; border-radius:12px;
          cursor:pointer; font-size:15px; font-weight:bold; }
  body.dark .type { border-color:#555; }
  .type.on { border-color:#c0392b; background:rgba(192,57,43,0.1); }
  .type small { display:block; font-weight:normal; opacity:0.6; font-size:11px; margin-top:4px; }
  .plist { text-align:left; margin-top:20px; }
  .plist h3 { font-size:14px; opacity:0.7; margin-bottom:8px; }
  .pitem { padding:12px 14px; border:1px solid #bbb; border-radius:10px;
           margin-bottom:8px; display:flex; justify-content:space-between;
           align-items:center; font-size:15px; }
  body.dark .pitem { border-color:#555; }
  .pitem .badge { font-size:11px; padding:3px 8px; border-radius:10px;
                  background:#c0392b; color:#fff; }
  .empty { font-size:13px; opacity:0.6; text-align:center; padding:12px; }
</style>
</head>
<body>
  <div class="top">
    <button class="chip" onclick="setLang('en',this)">English</button>
    <button class="chip" onclick="setLang('hi',this)">हिन्दी</button>
    <button class="chip" onclick="setLang('gu',this)">ગુજરાતી</button>
    <button class="chip" onclick="toggleDark()">🌓</button>
  </div>

  <!-- 1: Login -->
  <div class="card screen on" id="scrLogin">
    <div class="logo">🎬</div>
    <h1>CineSync</h1>
    <p class="tag" id="tag"></p>
    <div class="field">
      <label id="lblPhone"></label>
      <input type="text" id="phone" placeholder="+91 ...">
    </div>
    <button class="btn" onclick="sendOtp()" id="btnNext"></button>
    <button class="btn ghost" id="btnGoogle">G — <span id="lblGoogle"></span></button>
  </div>

  <!-- 2: OTP -->
  <div class="card screen" id="scrOtp">
    <button class="back" onclick="show('scrLogin')">←</button>
    <div class="logo">🔐</div>
    <h1>CineSync</h1>
    <p class="tag" id="otpTag"></p>
    <div class="otp" id="otpRow"></div>
    <button class="btn" onclick="verifyOtp()" id="btnVerify"></button>
    <p class="msg" id="otpMsg"></p>
  </div>

  <!-- 3: પ્રોજેક્ટ ઘર -->
  <div class="card screen" id="scrHome">
    <div class="logo">🎬</div>
    <h1>CineSync</h1>
    <p class="tag" id="homeTag"></p>

    <div class="plist" id="plistBox">
      <h3 id="lblList"></h3>
      <div id="plist"></div>
    </div>

    <button class="btn" onclick="show('scrNew')" id="btnNew"></button>
    <button class="btn ghost" onclick="logout()" id="btnOut"></button>
  </div>

  <!-- 4: નવું પ્રોજેક્ટ -->
  <div class="card screen" id="scrNew">
    <button class="back" onclick="show('scrHome')">←</button>
    <div class="logo">🎬</div>
    <h1 id="lblNewTitle"></h1>
    <p class="tag" id="lblNewTag"></p>

    <div class="field">
      <label id="lblPName"></label>
      <input type="text" id="pname">
    </div>

    <div class="field">
      <label id="lblPType"></label>
      <div class="types" id="types"></div>
    </div>

    <button class="btn" onclick="createProject()" id="btnCreate"></button>
    <p class="msg" id="pMsg"></p>
  </div>

<script>
const T = {
  en: { tag:"Film Production, One Chain — Script to Budget",
        phone:"Phone or Email", next:"Continue", google:"Sign in with Google",
        otpTag:"Enter the 6-digit code", verify:"Verify & Enter",
        wrong:"Wrong code — try again", ok:"Welcome to CineSync!",
        homeTag:"Your Projects", list:"Projects", newBtn:"+ New Project",
        out:"Log out", newTitle:"New Project", newTag:"Step 1 of the chain",
        pName:"Project name", pType:"Project type",
        create:"Create Project", needName:"Enter project name first",
        needType:"Select a project type",
        types:[["Feature Film","Single film"],["Web Series","Episodes"],
               ["Documentary","Docu"],["Ad Film","Commercial"],["Short Film","Short"]],
        numbering:{0:"Sc 1, 2, 3…",1:"Ep 1 – Sc 1…",2:"Part 1, 2…",3:"Sc 1…",4:"Sc 1…"},
        created:"Project created!" },
  hi: { tag:"फिल्म प्रोडक्शन, एक श्रृंखला — Script से Budget तक",
        phone:"फ़ोन या ईमेल", next:"आगे बढ़ें", google:"Google से प्रवेश",
        otpTag:"6 अंक का कोड डालें", verify:"जाँचें और प्रवेश करें",
        wrong:"गलत कोड — फिर कोशिश करें", ok:"CineSync में आपका स्वागत है!",
        homeTag:"आपके प्रोजेक्ट", list:"प्रोजेक्ट", newBtn:"+ नया प्रोजेक्ट",
        out:"लॉग आउट", newTitle:"नया प्रोजेक्ट", newTag:"श्रृंखला का पहला कदम",
        pName:"प्रोजेक्ट का नाम", pType:"प्रोजेक्ट का प्रकार",
        create:"प्रोजेक्ट बनाएँ", needName:"पहले प्रोजेक्ट का नाम डालें",
        needType:"प्रोजेक्ट का प्रकार चुनें",
        types:[["फ़ीचर फ़िल्म","एक फ़िल्म"],["वेब सीरीज़","एपिसोड"],
               ["डॉक्यूमेंट्री","डॉक्यू"],["एड फ़िल्म","विज्ञापन"],["शॉर्ट फ़िल्म","लघु"]],
        numbering:{0:"Sc 1, 2, 3…",1:"Ep 1 – Sc 1…",2:"Part 1, 2…",3:"Sc 1…",4:"Sc 1…"},
        created:"प्रोजेक्ट बन गया!" },
  gu: { tag:"ફિલ્મ પ્રોડક્શન, એક સાંકળ — Script થી Budget સુધી",
        phone:"ફોન નંબર કે ઈમેલ", next:"આગળ વધો", google:"Google થી પ્રવેશ",
        otpTag:"6 આંકડા નો કોડ નાખો", verify:"ચકાસો અને પ્રવેશો",
        wrong:"ખોટો કોડ — ફરી પ્રયત્ન કરો", ok:"CineSync માં સ્વાગત!",
        homeTag:"તમારા પ્રોજેક્ટ", list:"પ્રોજેક્ટ", newBtn:"+ નવું પ્રોજેક્ટ",
        out:"બહાર નીકળો", newTitle:"નવું પ્રોજેક્ટ", newTag:"સાંકળ નું પહેલું પગલું",
        pName:"પ્રોજેક્ટ નું નામ", pType:"પ્રોજેક્ટ નો પ્રકાર",
        create:"પ્રોજેક્ટ બનાવો", needName:"પહેલા પ્રોજેક્ટ નું નામ નાખો",
        needType:"પ્રોજેક્ટ નો પ્રકાર પસંદ કરો",
        types:[["ફિચર ફિલ્મ","એક ફિલ્મ"],["વેબ સિરીઝ","એપિસોડ"],
               ["ડોક્યુમેન્ટ્રી","ડોક્યુ"],["એડ ફિલ્મ","જાહેરાત"],["શોર્ટ ફિલ્મ","ટૂંકી"]],
        numbering:{0:"Sc 1, 2, 3…",1:"Ep 1 – Sc 1…",2:"Part 1, 2…",3:"Sc 1…",4:"Sc 1…"},
        created:"પ્રોજેક્ટ બની ગયો!" }
};
let lang = localStorage.getItem("cs_lang") || "gu";
let pickedType = -1;

/* ---------- OTP ખાનાં (6) ---------- */
const otpRow = document.getElementById("otpRow");
for(let i=0; i<6; i++){
  const b = document.createElement("input");
  b.maxLength = 1; b.inputMode = "numeric"; b.autocomplete = "one-time-code";
  b.addEventListener("input", ()=>{ if(b.value.length>1){ b.value = b.value.slice(0,1); }
    if(b.value && i<5) otpRow.querySelectorAll("input")[i+1].focus(); });
  b.addEventListener("keydown", e=>{
    if(e.key==="Backspace"){
      if(b.value){ b.value=""; e.preventDefault(); }
      else if(i>0){ const a=otpRow.querySelectorAll("input");
        a[i-1].focus(); a[i-1].value=""; e.preventDefault(); }
    }
  });
  otpRow.appendChild(b);
}

/* ---------- Type બટન (5) ---------- */
const typesBox = document.getElementById("types");
T.gu.types.forEach((tp, i)=>{
  const d = document.createElement("div");
  d.className = "type";
  d.onclick = ()=>{ pickedType = i;
    typesBox.querySelectorAll(".type").forEach(x=>x.classList.remove("on"));
    d.classList.add("on"); renderTypeHints(); };
  typesBox.appendChild(d);
});

/* ---------- ભાષા / દેખાવ / સ્ક્રીન ---------- */
function setLang(l, btn){
  lang = l; localStorage.setItem("cs_lang", l);
  const t = T[l];
  document.getElementById("tag").textContent = t.tag;
  document.getElementById("otpTag").textContent = t.otpTag;
  document.getElementById("lblPhone").textContent = t.phone;
  document.getElementById("btnNext").textContent = t.next;
  document.getElementById("btnVerify").textContent = t.verify;
  document.getElementById("lblGoogle").textContent = t.google;
  document.getElementById("homeTag").textContent = t.homeTag;
  document.getElementById("lblList").textContent = t.list;
  document.getElementById("btnNew").textContent = t.newBtn;
  document.getElementById("btnOut").textContent = t.out;
  document.getElementById("lblNewTitle").textContent = t.newTitle;
  document.getElementById("lblNewTag").textContent = t.newTag;
  document.getElementById("lblPName").textContent = t.pName;
  document.getElementById("lblPType").textContent = t.pType;
  document.getElementById("btnCreate").textContent = t.create;
  typesBox.querySelectorAll(".type").forEach((d,i)=>{
    d.innerHTML = t.types[i][0] + "<small>" + t.types[i][1] + "</small>";
  });
  renderTypeHints(); renderList();
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
  btn.classList.add("on");
}
function renderTypeHints(){
  const t = T[lang];
  typesBox.querySelectorAll(".type").forEach((d,i)=>{
    const hint = d.querySelector("small");
    hint.textContent = (i===pickedType) ? t.numbering[i] : t.types[i][1];
  });
}
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("cs_dark", document.body.classList.contains("dark")?"1":"0");
}
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
  if(id==="scrHome") renderList();
}

/* ---------- પ્રોજેક્ટ: સાચવાય + યાદી ---------- */
function getProjects(){ return JSON.parse(localStorage.getItem("cs_projects")||"[]"); }
function renderList(){
  const t = T[lang];
  const ps = getProjects();
  const box = document.getElementById("plist");
  document.getElementById("plistBox").style.display = ps.length ? "block" : "none";
  box.innerHTML = "";
  ps.forEach(p=>{
    const d = document.createElement("div");
    d.className = "pitem";
    d.innerHTML = "<span>"+p.name+"</span><span class='badge'>"+t.types[p.type][0]+"</span>";
    box.appendChild(d);
  });
}
function createProject(){
  const t = T[lang];
  const name = document.getElementById("pname").value.trim();
  const msg = document.getElementById("pMsg");
  if(!name){ msg.className="msg err"; msg.textContent=t.needName; return; }
  if(pickedType<0){ msg.className="msg err"; msg.textContent=t.needType; return; }
  const ps = getProjects();
  ps.push({ name:name, type:pickedType, made:"" });
  localStorage.setItem("cs_projects", JSON.stringify(ps));
  document.getElementById("pname").value = ""; pickedType = -1;
  typesBox.querySelectorAll(".type").forEach(x=>x.classList.remove("on"));
  renderTypeHints();
  msg.className="msg ok"; msg.textContent=t.created;
  setTimeout(()=>{ show("scrHome"); }, 600);
}
function logout(){ show("scrLogin"); }

/* ---------- OTP ચકાસણી ---------- */
const CODE = "123456";
function sendOtp(){
  const v = document.getElementById("phone").value.trim();
  if(!v){ document.getElementById("phone").focus(); return; }
  show("scrOtp"); otpRow.querySelectorAll("input")[0].focus();
}
function verifyOtp(){
  const code = [...otpRow.querySelectorAll("input")].map(i=>i.value).join("");
  const msg = document.getElementById("otpMsg");
  if(code === CODE){ show("scrHome"); }
  else { msg.className="msg err"; msg.textContent=T[lang].wrong; }
}

/* ---------- શરૂઆત ---------- */
if(localStorage.getItem("cs_dark")==="1") document.body.classList.add("dark");
document.getElementById("phone").addEventListener("keydown", e=>{ if(e.key==="Enter") sendOtp(); });
setLang(lang, document.querySelectorAll(".chip")[2]);
</script>
</body>
</html>
